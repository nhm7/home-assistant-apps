name: Publish RDP Gateway image

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-rdp-gateway.yaml
      - apps/rdp-gateway/**
      - tests/**
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-rdp-gateway.yaml
      - apps/rdp-gateway/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: rdp-gateway-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Read app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Read version from app configuration
        shell: bash
        run: |
          value="$(awk '$1 == "version:" { print $2 }' apps/rdp-gateway/config.yaml)"
          test "$(printf '%s\n' "$value" | wc -l)" -eq 1
          test -n "$value"
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build architecture image
        uses: docker/build-push-action@v7
        with:
          context: apps/rdp-gateway
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/nhm7/${{ matrix.arch }}-rdp-gateway:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Run smoke test before publication
        shell: bash
        run: |
          set -euo pipefail
          name="rdp-gateway-smoke-${{ matrix.arch }}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$name" --publish 127.0.0.1:18081:8081 \
            --volume "$GITHUB_WORKSPACE/tests/options.json:/data/options.json:ro" \
            "ghcr.io/nhm7/${{ matrix.arch }}-rdp-gateway:${{ needs.prepare.outputs.version }}"
          python3 tests/smoke.py http://127.0.0.1:18081
      - name: Publish tested architecture images
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          docker push "ghcr.io/nhm7/${{ matrix.arch }}-rdp-gateway:${{ needs.prepare.outputs.version }}"
