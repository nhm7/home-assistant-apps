name: RDP Gateway
slug: rdp_gateway
description: Browser-based RDP access through Apache Guacamole
version: 0.1.12
image: ghcr.io/nhm7/{arch}-rdp-gateway
arch:
  - aarch64
  - amd64
startup: services
boot: auto
ingress: true
ingress_port: 8081
panel_icon: mdi:remote-desktop
panel_title: RDP Gateway
panel_admin: true
options:
  rdp_host: ""
  rdp_port: 3389
  rdp_username: ""
  rdp_password: ""
  rdp_domain: ""
  rdp_security: any
  rdp_ignore_cert: false
schema:
  rdp_host: str
  rdp_port: port
  rdp_username: str
  rdp_password: password
  rdp_domain: str?
  rdp_security: list(any|nla|tls|rdp)
  rdp_ignore_cert: bool
